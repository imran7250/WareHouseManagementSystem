  

<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>WMS — Forgot Password</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ----- RESET & BASE ----- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ----- CONTAINER ----- */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.02);
            padding: 40px 32px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.3s ease;
        }

        .login-container:hover {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        /* ----- HEADER ----- */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .brand-icon {
            font-size: 2.5rem;
            color: #008b8b;
            margin-bottom: 8px;
        }

        .login-header h2 {
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            color: #0a0a0a;
            margin: 0;
        }

        .login-header .subtitle {
            font-size: 0.95rem;
            color: #5a5a5a;
            margin-top: 4px;
            font-weight: 400;
        }

        /* ----- FORM ----- */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            transition: border-color 0.25s, box-shadow 0.25s;
            background: #f9f9f9;
        }

        .input-group:focus-within {
            border-color: #008b8b;
            box-shadow: 0 0 0 3px rgba(0, 139, 139, 0.12);
            background: #ffffff;
        }

        .input-group .input-group-prepend {
            padding: 0 0 0 16px;
            color: #6a6a6a;
            font-size: 1rem;
        }

        .input-group input {
            border: none;
            background: transparent;
            padding: 14px 16px 14px 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            width: 100%;
            outline: none;
            border-radius: 12px;
        }

        .input-group input::placeholder {
            color: #a0a0a0;
            font-weight: 400;
        }

        /* ----- BUTTON ----- */
        .btn-login {
            width: 100%;
            background: #008b8b;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.05rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 139, 139, 0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: #006b6b;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 139, 139, 0.25);
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        /* ----- MESSAGE ----- */
        .alert {
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 20px;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-info {
            background: #eff6ff;
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }

        /* ----- BACK LINK ----- */
        .message-container {
            text-align: center;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #e8e8e8;
        }

        .message-container a {
            color: #008b8b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .message-container a:hover {
            color: #006b6b;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 576px) {
            .login-container {
                padding: 32px 20px;
                border-radius: 20px;
            }

            .login-header h2 {
                font-size: 1.5rem;
            }

            .input-group input {
                padding: 12px 14px 12px 10px;
                font-size: 0.95rem;
            }

            .btn-login {
                font-size: 1rem;
                padding: 13px;
            }
        }

        @media (max-width: 380px) {
            .login-container {
                padding: 24px 16px;
            }

            .login-header h2 {
                font-size: 1.3rem;
            }

            .input-group .input-group-prepend {
                padding-left: 12px;
            }

            .input-group input {
                padding: 10px 12px 10px 8px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <div class="brand-icon">
                <i class="fas fa-warehouse"></i>
            </div>
            <h2>Forgot Password</h2>
            <p class="subtitle">Enter your email to receive a new password</p>
        </div>

        <!-- ===== FORM ===== -->
        <form th:action="@{/user/newPwdGen}" method="POST">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="username"><i class="fas fa-envelope me-1" style="color:#008b8b;"></i> Email</label>
                <div class="input-group">
                    <span class="input-group-prepend"><i class="fas fa-user"></i></span>
                    <input type="email" id="username" name="uemail" placeholder="Enter your registered email" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-paper-plane"></i> Send New Password
            </button>
        </form>

        <!-- Display message if exists -->
        <div th:if="${message}" class="alert alert-info">
            <i class="fas fa-info-circle"></i> <span th:text="${message}"></span>
        </div>

        <!-- Back to Login -->
        <div class="message-container">
            <a th:href="@{/user/showLogin}">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
