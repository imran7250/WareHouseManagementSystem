
<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>WMS — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ----- RESET & BASE ----- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            padding: 40px 32px;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header .brand-icon { font-size: 2.5rem; color: #008b8b; margin-bottom: 8px; }
        .login-header h2 { font-weight: 800; font-size: 1.8rem; color: #0a0a0a; }
        .login-header .subtitle { color: #5a5a5a; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 6px; }
        .input-group {
            display: flex;
            align-items: center;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            background: #f9f9f9;
            transition: border-color 0.25s, box-shadow 0.25s;
            position: relative;
        }
        .input-group:focus-within {
            border-color: #008b8b;
            box-shadow: 0 0 0 3px rgba(0,139,139,0.12);
            background: #ffffff;
        }
        .input-group .input-group-prepend { padding-left: 16px; color: #6a6a6a; }
        .input-group input {
            border: none;
            background: transparent;
            padding: 14px 16px;
            font-size: 1rem;
            width: 100%;
            outline: none;
        }
        .input-group input::placeholder { color: #a0a0a0; }
        .password-toggle {
            position: absolute;
            right: 16px;
            cursor: pointer;
            color: #6a6a6a;
            padding: 4px;
        }
        .password-toggle:hover { color: #008b8b; }
        .btn-login {
            width: 100%;
            background: #008b8b;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0,139,139,0.15);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-login:hover { background: #006b6b; transform: translateY(-2px); }
        .forgot-password { text-align: center; margin-top: 16px; }
        .forgot-password a { color: #5a5a5a; text-decoration: none; font-weight: 500; }
        .forgot-password a:hover { color: #008b8b; }
        .btn-create-account {
            width: 100%;
            background: transparent;
            color: #008b8b;
            border: 1.5px solid #008b8b;
            padding: 12px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }
        .btn-create-account:hover { background: #008b8b; color: #fff; }
        .alert {
            border-radius: 12px;
            padding: 14px 18px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-danger { background: #fef2f2; color: #991b1b; border-left: 4px solid #dc2626; }
        .alert-success { background: #ecfdf5; color: #065f46; border-left: 4px solid #10b981; }
        .divider { display: flex; align-items: center; margin: 20px 0 16px; gap: 16px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e8e8e8; }
        .divider span { color: #8a8a8a; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
        @media (max-width: 576px) {
            .login-container { padding: 32px 20px; }
            .login-header h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="brand-icon"><i class="fas fa-warehouse"></i></div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your WMS account</p>
        </div>

        <!-- ===== LOGIN FORM ===== -->
        <form th:action="@{/login}" method="POST">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="username">Email</label>
                <div class="input-group">
                    <span class="input-group-prepend"><i class="fas fa-user"></i></span>
                    <input type="text" id="username" name="username" placeholder="Enter your email" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-group">
                    <span class="input-group-prepend"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <span class="password-toggle" id="passwordToggle"><i class="far fa-eye"></i></span>
                </div>
            </div>

            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Sign In</button>

            <div class="forgot-password">
                <a th:href="@{/user/showForgotPwd}">Forgot password?</a>
            </div>

            <div class="divider"><span>or</span></div>

            <a th:href="@{/user/register}" class="btn-create-account">
                <i class="fas fa-user-plus"></i> Create Account
            </a>
        </form>

        <!-- Error / Success Messages -->
        <div th:if="${param.error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i> <b>Invalid credentials or inactive account</b>
        </div>
        <div th:if="${param.success}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <b>You have been logged out successfully</b>
        </div>
    </div>

    <script>
        document.getElementById('passwordToggle').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });
    </script>
</body>
</html>
